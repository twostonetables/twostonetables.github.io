<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    </head>
    <body>
        
        <section id="convert-section">
                <h1>Metric/Imperial Unit Conversion</h1>
                <!-- <p id="user-input" >15</p> -->
                <input type="number" id="user-input" placeholder="20">
                <button id="convert-btn">Convert</button>
        </section>
        <section id="conversion-section">
            <div id="section-container" class="conversion-section-container">
                <div id="container" class="length-container">
                <h2>Length (Meter/Feet)</h2>
                <p id ="length-string" >20 meters =</p>
                </div>
                <div id="container" class="volume-container">
                    <h2>Volume (Liters/Gallons)</h2>
                    <p id ="volume-string">20 liters = </p>
                </div>
                <div id="container" class="mass-container">
                    <h2>Mass (Kilograms/Pounds)</h2>
                    <p id="mass-string">20 Kilos = </p>
                </div>
            </div>
        </section>
        <script src="index.js"></script>
    </body>
</html>
